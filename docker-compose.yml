# Docker Compose file for SistemaScuolaLingue
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sistemascuolalingue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gagandeepsuman
      POSTGRES_USER: gagandeepsuman
      POSTGRES_PASSWORD: Gaggu123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data.sql:/docker-entrypoint-initdb.d/data.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Application
  app:
    build: .
    container_name: sistemascuolalingue-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Database connection
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gagandeepsuman
      SPRING_DATASOURCE_USERNAME: gagandeepsuman
      SPRING_DATASOURCE_PASSWORD: Gaggu123
      # Optional: Active profiles
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres:
        condition: service_healthy
    # Optional: Limit resources
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.5"
    #       memory: 512M
    #   reservations:
    #     cpus: "0.25"
    #     memory: 256M

volumes:
  postgres_data: