name: Java CI & Unit Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # 1. Add PostgreSQL 18 Service Container here
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: SistemaScuolaLingue
          POSTGRES_USER: gagandeepsuman
          POSTGRES_PASSWORD: Gaggu123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # 2. Workflow steps run after PostgreSQL is healthy
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up JDK 26
      uses: actions/setup-java@v5
      with:
        java-version: '26'
        distribution: 'temurin'
        cache: maven

    - name: Execute Tests with Maven
      run: mvn test
