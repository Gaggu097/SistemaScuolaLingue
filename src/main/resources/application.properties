# Database Configuration
# Use environment variables with fallback to default values for local development
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gagandeepsuman}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gagandeepsuman}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Gaggu123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate/JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging Configuration (optional, can also use logback-spring.xml)
logging.level.org.gagandeepsuman=INFO
logging.level.org.springframework=WARN

