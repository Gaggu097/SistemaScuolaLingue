<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title}">Consultare Statistiche Corsi - Gestore</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="mb-4" th:text="${title}">Consultare Statistiche Corsi - Gestore</h1>

        <div th:if="${message}" class="alert" th:classappend="${messageType} == 'success' ? 'alert-success' : 'alert-danger'">
            <p th:text="${message}"></p>
        </div>

        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Statistiche Corsi</h5>
            </div>
            <div class="card-body">
        <div th:if="${statisticheCorso == null or statisticheCorso.isEmpty()}">
            <div class="alert alert-info">
                Nessuna statistica disponibile.
            </div>
        </div>

        <div th:unless="${statisticheCorso == null or statisticheCorso.isEmpty()}">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Lingua</th>
                            <th>Livello</th>
                            <th>Iscritti</th>
                            <th>Posti Tot.</th>
                            <th>Disponibili</th>
                            <th>Incasso (€)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="stat : ${statisticheCorso}">
                            <td th:text="${stat.id}"></td>
                            <td th:text="${stat.lingua}"></td>
                            <td th:text="${stat.livello}"></td>
                            <td th:text="${stat.iscritti}"></td>
                            <td th:text="${stat.postiTotali}"></td>
                            <td th:text="${stat.disponibili}"></td>
                            <td th:text="${stat.incasso}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
        </div>

        <a href="/gestore" class="btn btn-secondary mt-3">Torna al Menu Gestore</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
