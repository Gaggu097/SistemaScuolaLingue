<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title}">Gestione Docenti</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="mb-4" th:text="${title}">Gestione Docenti</h1>

        <div th:if="${message}" class="alert" th:classappend="${messageType} == 'success' ? 'alert-success' :
                                 (${messageType} == 'error' ? 'alert-danger' : 'alert-info')">
            <p th:text="${message}"></p>
        </div>

        <div th:if="${docenti == null or docenti.isEmpty()}">
            <div class="alert alert-info">
                Nessun docente presente nel sistema.
            </div>
        </div>

        <div th:unless="${docenti == null or docenti.isEmpty()}">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Cognome</th>
                            <th>Email</th>
                            <th>Telefono</th>
                            <th>Azioni</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="docente : ${docenti}">
                            <td th:text="${docente.id}"></td>
                            <td th:text="${docente.nome}"></td>
                            <td th:text="${docente.cognome}"></td>
                            <td th:text="${docente.email}"></td>
                            <td th:text="${docente.telefono}"></td>
                            <td>
                                <a th:href="@{/gestore/docenti/__${docente.id}__/aggiorna}" class="btn btn-sm btn-outline-primary">Aggiorna</a>
                                <a th:href="@{/gestore/docenti/__${docente.id}__/elimina}" class="btn btn-sm btn-outline-danger" onclick="return confermaEliminazione()">Elimina</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-6">
                <a href="/gestore/docenti/aggiungi" class="btn btn-primary w-100 mb-3">
                    ➕ Aggiungi Nuovo Docente
                </a>
            </div>
            <div class="col-md-6">
                <a href="/gestore/classi" class="btn btn-outline-secondary w-100 mb-3">
                    Vai alla Gestione Classi
                </a>
            </div>
        </div>

        <a href="/gestore" class="btn btn-secondary">Torna al Menu Gestore</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
