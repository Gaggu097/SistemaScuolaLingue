<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title}">Annulla Iscrizione</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="mb-4" th:text="${title}">Annulla Iscrizione</h1>

        <div th:if="${message}" class="alert" th:classappend="${messageType} == 'success' ? 'alert-success' : 'alert-danger'">
            <p th:text="${message}"></p>
        </div>

        <form th:action="@{/cliente/annulla}" method="post" class="row g-3 needs-validation" novalidate>
            <div class="col-md-6">
                <label for="idCliente" class="form-label">ID Cliente</label>
                <input type="number" class="form-control" id="idCliente" name="idCliente" required min="1">
                <div class="invalid-feedback">
                    Inserisci il tuo ID cliente.
                </div>
            </div>
            <div class="col-md-6">
                <label for="idIscrizione" class="form-label">ID Iscrizione</label>
                <input type="number" class="form-control" id="idIscrizione" name="idIscrizione" required min="1">
                <div class="invalid-feedback">
                    Inserisci l'ID dell'iscrizione da annullare.
                </div>
            </div>

            <div class="col-12">
                <button type="submit" class="btn btn-danger">Annulla Iscrizione</button>
                <a href="/cliente" class="btn btn-secondary">Torna al Menu Cliente</a>
            </div>
        </form>

        <hr>
        <p class="text-muted">
            <small>Versione 1.0 - Interfaccia Web</small>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Example starter JavaScript for disabling form submissions if there are invalid fields
      (() => {
        'use strict'
        const forms = document.querySelectorAll('.needs-validation')
        Array.from(forms).forEach(form => {
          form.addEventListener('submit', event => {
            if (!form.checkValidity()) {
              event.preventDefault()
              event.stopPropagation()
            }
            form.classList.add('was-validated')
          })
        })
      })()
    </script>
</body>
</html>
