<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title}">Organizza Nuova Classe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="mb-4" th:text="${title}">Organizza Nuova Classe</h1>

        <div th:if="${message}" class="alert" th:classappend="${messageType} == 'success' ? 'alert-success' : 'alert-danger'">
            <p th:text="${message}"></p>
        </div>

        <form th:action="@{/gestore/classi/organizza}" method="post">
            <div class="mb-3">
                <label for="idCorso" class="form-label">Corso</label>
                <select class="form-select" id="idCorso" name="idCorso" required>
                    <option value="">Seleziona un corso</option>
                    <option th:each="corso : ${corsi}"
                            th:value="${corso.id}"
                            th:text="${corso.linguaCorso} + ' ' + ${corso.livelloCorso} + ' (€' + ${corso.costo} + ')'">
                        Seleziona un corso
                    </option>
                </select>
                <div class="form-text">Seleziona il corso da associare alla nuova classe</div>
            </div>

            <div class="mb-3">
                <label for="capienza" class="form-label">Capienza Massima</label>
                <input type="number" class="form-control" id="capienza" name="capienza" required
                       min="1" placeholder="Inserisci il numero massimo di studenti">
                <div class="form-text">Numero massimo di studenti che possono essere iscritti alla classe</div>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <a href="/gestore/classi" class="btn btn-secondary me-md-2">Annulla</a>
                <button type="submit" class="btn btn-primary">Organizza Classe</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
