<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title}">Elimina Impiegato Segreteria</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="mb-4" th:text="${title}">Elimina Impiegato Segreteria</h1>

        <div th:if="${message}" class="alert" th:classappend="${messageType} == 'success' ? 'alert-success' : 'alert-danger'">
            <p th:text="${message}"></p>
        </div>

        <div class="alert alert-warning">
            <h5>Attenzione</h5>
            <p>Sei sicuro di voler eliminare l'impiegato segreteria con ID <strong th:text="${impiegato.id}">1</strong>?</p>
            <p class="mb-0">
                Questa azione è irreversibile e rimuoverà permanentemente l'impiegato segreteria dal sistema.
            </p>
        </div>

        <form th:action="@{/gestore/impiegati/{id}/elimina(id=${impiegato.id})}" method="post">
            <div class="d-grid gap-2 d-md-flex justify-content-md-between">
                <a href="/gestore/impiegati" class="btn btn-outline-secondary">Annulla</a>
                <button type="submit" class="btn btn-danger">Elimina Impiegato Segreteria</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
