<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title}">Consultare Iscritti</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="mb-4" th:text="${title}">Consultare Iscritti</h1>

        <div th:if="${message}" class="alert" th:classappend="${messageType} == 'success' ? 'alert-success' : 'alert-danger'">
            <p th:text="${message}"></p>
        </div>

        <div th:if="${iscrizioni == null or iscrizioni.isEmpty()}">
            <div class="alert alert-info">
                Nessun'iscrizione attualmente attiva.
            </div>
        </div>

        <div th:unless="${iscrizioni == null or iscrizioni.isEmpty()}">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID Iscrizione</th>
                            <th>Data Iscrizione</th>
                            <th>Cliente</th>
                            <th>Corso</th>
                            <th>Docente</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="iscrizione : ${iscrizioni}">
                            <td th:text="${iscrizione.id}">1</td>
                            <td th:text="${#temporals.format(iscrizione.dataIscrizione, 'dd/MM/yyyy')}">01/01/2026</td>
                            <td th:text="${iscrizione.clienteCognome} + ' ' + ${iscrizione.clienteNome}">Rossi Mario</td>
                            <td th:text="${iscrizione.corsoLingua} + ' ' + ${iscrizione.corsoLivello}">Inglese B1</td>
                            <td th:text="${iscrizione.docenteCognome} + ' ' + ${iscrizione.docenteNome}">Verdi Luca</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <a href="/segreteria" class="btn btn-secondary">Torna al Menu Segreteria</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
